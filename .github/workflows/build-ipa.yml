name: Build iOS Sideload IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen & librsvg
        run: brew install xcodegen librsvg

      - name: Sync web assets into iOS bundle
        run: |
          mkdir -p ios/QingKaLookup/web
          cp index.html styles.css china_food_db.js data.js recipe_parser.js app.js icon.svg ios/QingKaLookup/web/

      - name: Render 1024x1024 AppIcon PNG from icon.svg
        run: |
          rsvg-convert -w 1024 -h 1024 icon.svg \
            -o ios/QingKaLookup/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned Release .app
        working-directory: ios
        run: |
          xcodebuild \
            -project QingKaLookup.xcodeproj \
            -scheme QingKaLookup \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa for sideloading
        id: package
        working-directory: ios
        run: |
          PLIST="build/Build/Products/Release-iphoneos/QingKaLookup.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "Version: $VERSION ($BUILD)"
          IPA_NAME="QingKaLookup-${VERSION}-${BUILD}.ipa"
          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/QingKaLookup.app dist/Payload/
          cd dist
          zip -qry "../${IPA_NAME}" Payload
          ls -lh "../${IPA_NAME}"

      - name: Upload versioned .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: QingKaLookup-iOS-IPA
          path: ios/${{ steps.package.outputs.ipa_name }}
          retention-days: 30
