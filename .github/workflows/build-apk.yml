name: Build Android Phase 0 APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'china_food_db.js'
      - 'data.js'
      - 'recipe_parser.js'
      - 'app.js'
      - 'icon.svg'
      - 'android/**'
      - 'tests/verify_core.mjs'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & run core gate
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests/verify_core.mjs
        run: node tests/verify_core.mjs

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Phase 0 Debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Package QingKaLookup-Android-1.8.1-1.apk
        working-directory: android
        run: |
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          APK_OUT="QingKaLookup-Android-1.8.1-1.apk"
          cp "$APK_SRC" "$APK_OUT"
          ls -lh "$APK_OUT"
          unzip -l "$APK_OUT" | grep "assets/web/"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QingKaLookup-Android-APK
          path: android/QingKaLookup-Android-1.8.1-1.apk
          retention-days: 30
