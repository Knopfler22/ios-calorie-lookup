name: QingKaLookup
options:
  bundleIdPrefix: com.qingka
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_NAME: QingKaLookup
    MARKETING_VERSION: "1.6.0"
    CURRENT_PROJECT_VERSION: "8"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  QingKaLookup:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: QingKaLookup
        excludes:
          - web
          - Info.plist
      - path: QingKaLookup/web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingka.calorielookup
        INFOPLIST_FILE: QingKaLookup/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.5.0"
        CURRENT_PROJECT_VERSION: "7"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
